name: karigor_khoj
description: Local Service Provider & Gig Worker Directory
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Image Picker
  image_picker: ^1.1.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
